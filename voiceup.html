const audioCache = {};
function getAudioBuffer(ctx, base64, cacheKey) {
  return new Promise((resolve, reject) => {
    if (audioCache[cacheKey]) { resolve(audioCache[cacheKey]); return; }
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    ctx.decodeAudioData(bytes.buffer, (buf) => {
      audioCache[cacheKey] = buf;
      resolve(buf);
    }, reject);
  });
}

const ctx = new (window.AudioContext || window.webkitAudioContext)();

document.getElementById("tempo").addEventListener("input", function() {
  document.getElementById("tempo-label").textContent = "Tempo: " + this.value + " bpm";
});

// degrees 1 2 3 4 5 4 3 2 1 as note-letter offsets from C3
const seq3 = ["C3","D3","E3","F3","G3","F3","E3","D3","C3"];
const seqDb3 = ["Db3","Eb3","F3","Gb3","Ab3","Gb3","F3","Eb3","Db3"];

async function play(sampleLen) {
  const notesData = sampleLen === 500 ? NOTES_500 : (sampleLen === 1000 ? NOTES_1000 : NOTES_2000);
  const tempo = parseInt(document.getElementById("tempo").value, 10);
  const noteDur = 60 / tempo / 2; // eighth note in seconds
  const chordDur = 60 / tempo; // quarter note in seconds

  let t = ctx.currentTime + 0.15;

  async function scheduleNote(name, startTime, playDur, label) {
    const b64 = notesData[name];
    if (!b64) return;
    const buf = await getAudioBuffer(ctx, b64, sampleLen + "_" + name);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(1, startTime);
    // fade out over last 30ms of the intended play duration to avoid a click if cut short
    const fadeStart = startTime + Math.max(0.02, playDur - 0.03);
    gain.gain.setValueAtTime(1, fadeStart);
    gain.gain.linearRampToValueAtTime(0, fadeStart + 0.03);
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(startTime);
    src.stop(startTime + playDur + 0.05);
    setTimeout(() => { document.getElementById("status").textContent = label; }, Math.max(0, (startTime - ctx.currentTime) * 1000));
  }

  async function scheduleStep(seq, rootLabel) {
    // chord = play root, third (2 semitones away in letters is approx, using root note tripled for simplicity in this quick test)
    await scheduleNote(seq[0], t, chordDur, rootLabel + " chord");
    t += chordDur;
    for (const n of seq) {
      await scheduleNote(n, t, noteDur, n);
      t += noteDur;
    }
    // repeat last note once
    await scheduleNote(seq[seq.length-1], t, noteDur, seq[seq.length-1] + " (repeat)");
    t += noteDur;
  }

  await scheduleStep(seq3, "C3");
  await scheduleStep(seqDb3, "C#3");
}
</script>
